<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Moon Author Center</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500&display=swap');

body {
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #f7f6ff, #eef3ff);
  overflow-x: hidden;
}

/* MAIN SCREEN */
.screen {
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* MONITOR FRAME */
.monitor {
  width: 1100px;
  height: 650px;
  background: #111;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.2);
}

/* SCREEN INSIDE */
.inner {
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top, #ffffff, #e9ecff);
  border-radius: 15px;
  position: relative;
  overflow: hidden;
}

/* MOON LOGO */
.moon {
  width: 140px;
  height: 140px;
  background: linear-gradient(135deg, #c7b9ff, #ffd6e7);
  border-radius: 50%;
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  color: #333;
}

/* TITLE */
.title {
  text-align: center;
  margin-top: 210px;
  font-size: 28px;
  font-weight: 500;
  letter-spacing: 2px;
  color: #333;
}

.subtitle {
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
  color: #666;
}

/* BUTTONS */
.buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
}

button {
  padding: 10px 18px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 12px;
  transition: 0.3s;
}

.primary {
  background: linear-gradient(135deg, #a9b7ff, #f3b7ff);
  color: white;
}

.secondary {
  background: white;
  border: 1px solid #ccc;
}

button:hover {
  transform: scale(1.05);
}

/* LOGIN BOX */
.login {
  position: absolute;
  left: 30px;
  bottom: 40px;
  width: 200px;
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

.login input {
  width: 100%;
  margin-bottom: 8px;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 5px;
  font-size: 12px;
}

.login button {
  width: 100%;
  background: #a9b7ff;
  color: white;
}

/* WORKSPACE */
.workspace {
  position: absolute;
  right: 30px;
  bottom: 40px;
  width: 200px;
  background: white;
  padding: 15px;
  border-radius: 10px;
  font-size: 11px;
  color: #555;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<div class="screen">
  <div class="monitor">
    <div class="inner">

      <div class="moon">🌙 MOON</div>

      <div class="title">WRITE YOUR WORLD. LEAVE YOUR MARK.</div>
      <div class="subtitle">Author Center Platform for Writers & Creators</div>

      <div class="buttons">
        <button class="primary">JOIN THE GALAXY</button>
        <button class="secondary">EXPLORE NOVELS</button>
      </div>

      <div class="login">
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
      </div>

      <div class="workspace">
        <b>Workspace Preview</b><br><br>
        Your writing dashboard will appear here. Manage stories, chapters, and drafts.
      </div>

    </div>
  </div>
</div>

</body>
</html>
